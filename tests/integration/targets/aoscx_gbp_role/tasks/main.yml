# Integration tests for the aoscx_gbp_role module.
#
# Run with:
#   ansible-test integration aoscx_gbp_role --venv
#
# Requires an inventory entry named "aoscx" reachable with a pyaoscx release
# that ships the GbpRole class. Uses a temporary role named "ansible-test"
# and cleans up afterwards.

- name: Make sure the test role does not exist yet
  arubanetworks.aoscx.aoscx_gbp_role:
    name: ansible-test
    state: delete
  ignore_errors: true

- name: Create a GBP role
  arubanetworks.aoscx.aoscx_gbp_role:
    name: ansible-test
    role_id: 4000
  register: result

- name: Assert the role was created
  ansible.builtin.assert:
    that:
      - result.changed

- name: Create the role again (idempotent)
  arubanetworks.aoscx.aoscx_gbp_role:
    name: ansible-test
    role_id: 4000
  register: result

- name: Assert no change on re-create
  ansible.builtin.assert:
    that:
      - not result.changed

- name: Change the role ID
  arubanetworks.aoscx.aoscx_gbp_role:
    name: ansible-test
    role_id: 4001
    state: update
  register: result

- name: Assert the role ID changed
  ansible.builtin.assert:
    that:
      - result.changed

- name: Delete the role
  arubanetworks.aoscx.aoscx_gbp_role:
    name: ansible-test
    state: delete
  register: result

- name: Assert the role was deleted
  ansible.builtin.assert:
    that:
      - result.changed
