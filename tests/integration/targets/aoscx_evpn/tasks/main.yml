# Integration tests for the aoscx_evpn module.
#
# Run with:
#   ansible-test integration aoscx_evpn --venv
#
# Requires an inventory entry named "aoscx" reachable over httpapi with a
# pyaoscx release that ships the Evpn class. EVPN is a singleton, so this
# test changes the mac_move_timer and restores it to its original value.

- name: Read the current global mac_move_timer
  arubanetworks.aoscx.aoscx_facts:
  register: facts_result
  ignore_errors: true

- name: Change the global mac_move_timer
  arubanetworks.aoscx.aoscx_evpn:
    mac_move_timer: 181
  register: change_result

- name: Assert change reported
  ansible.builtin.assert:
    that:
      - change_result is changed

- name: Re-apply identical configuration
  arubanetworks.aoscx.aoscx_evpn:
    mac_move_timer: 181
  register: idem_result

- name: Assert re-apply did not change
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Restore the global mac_move_timer
  arubanetworks.aoscx.aoscx_evpn:
    mac_move_timer: 180
  register: restore_result

- name: Assert restore reported
  ansible.builtin.assert:
    that:
      - restore_result is changed

# dyn_vxlan_tunnel_bridging_mode: the original value is found in check mode
# (no change reported for the configured mode), then restored.
- name: Detect the current dyn_vxlan_tunnel_bridging_mode
  arubanetworks.aoscx.aoscx_evpn:
    dyn_vxlan_tunnel_bridging_mode: ibgp-ebgp
  check_mode: true
  register: bridging_probe

- name: Set the bridging mode to change
  ansible.builtin.set_fact:
    bridging_original: "{{ 'no-bridging' if bridging_probe is changed else 'ibgp-ebgp' }}"
    bridging_new: "{{ 'ibgp-ebgp' if bridging_probe is changed else 'no-bridging' }}"

- name: Change the dyn_vxlan_tunnel_bridging_mode
  arubanetworks.aoscx.aoscx_evpn:
    dyn_vxlan_tunnel_bridging_mode: "{{ bridging_new }}"
  register: bridging_change

- name: Re-apply the same dyn_vxlan_tunnel_bridging_mode
  arubanetworks.aoscx.aoscx_evpn:
    dyn_vxlan_tunnel_bridging_mode: "{{ bridging_new }}"
  register: bridging_idem

- name: Restore the dyn_vxlan_tunnel_bridging_mode
  arubanetworks.aoscx.aoscx_evpn:
    dyn_vxlan_tunnel_bridging_mode: "{{ bridging_original }}"
  register: bridging_restore

- name: Assert the dyn_vxlan_tunnel_bridging_mode results
  ansible.builtin.assert:
    that:
      - bridging_change is changed
      - bridging_idem is not changed
      - bridging_restore is changed
